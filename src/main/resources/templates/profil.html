<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/sablon :: head('Hesabım')}"></head>
<body>
<div class="sayfa" th:with="k=${aktifKullanici}">
    <th:block th:replace="~{fragments/sablon :: siteUst('profil')}"></th:block>

    <main class="ana" id="icerik">
        <div class="ana-ic">
            <div class="sayfa-baslik">
                <div class="doktor-kimlik">
                    <span class="avatar avatar-lg" aria-hidden="true" th:text="${k.basHarfler}"></span>
                    <div class="yigin-sik">
                        <h1>Hesabım</h1>
                        <p th:text="${k.gorunenAd} + ' · ' + ${k.rol.etiket}"></p>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/sablon :: mesajlar}"></div>

            <div class="izgara izgara-yan">
                <div class="yigin-genis">
                    <section class="kart" aria-labelledby="kimlik-baslik">
                        <div class="kart-baslik">
                            <h2 id="kimlik-baslik">Kimlik bilgileri</h2>
                            <span class="kart-ust-etiket">Değişiklik için kurumunuzla iletişime geçin</span>
                        </div>
                        <dl class="bilgi-listesi">
                            <div><dt>Ad soyad</dt><dd th:text="${k.adSoyad}"></dd></div>
                            <!-- Türe özgü satırları kullanıcı nesnesi verir (getProfilBilgileri) -->
                            <div th:each="b : ${k.profilBilgileri}"><dt th:text="${b.etiket}"></dt><dd class="sayilar" th:text="${b.deger}"></dd></div>
                            <div><dt>Giriş bilgisi</dt><dd th:text="${k.girisKimligiEtiketi}"></dd></div>
                        </dl>
                    </section>

                    <section class="kart" aria-labelledby="iletisim-baslik">
                        <div class="kart-baslik"><h2 id="iletisim-baslik">İletişim bilgileri</h2></div>
                        <form th:action="@{/profil/iletisim}" method="post" class="yigin">
                            <div class="alan">
                                <label class="etiket" for="eposta">
                                    <span th:text="${k.girisEpostaIleMi()} ? 'Kurumsal e-posta' : 'E-posta'"></span>
                                    <span class="istege-bagli" th:unless="${k.girisEpostaIleMi()}">(isteğe bağlı)</span>
                                </label>
                                <input class="girdi" type="email" id="eposta" name="eposta" th:value="${k.eposta}" autocomplete="email"
                                       th:attr="required=${k.girisEpostaIleMi()} ? 'required' : null, aria-describedby=${k.girisEpostaIleMi()} ? 'eposta-ipucu' : null">
                                <span class="alan-ipucu" id="eposta-ipucu" th:if="${k.girisEpostaIleMi()}">Giriş yaparken bu adresi kullanırsınız; değiştirirseniz yeni adresle giriş yaparsınız.</span>
                            </div>
                            <div class="alan">
                                <label class="etiket" for="telefon">Telefon</label>
                                <input class="girdi" type="tel" id="telefon" name="telefon" th:value="${k.telefon}" autocomplete="tel">
                            </div>
                            <div><button type="submit" class="dugme dugme-birincil">Bilgileri kaydet</button></div>
                        </form>
                    </section>
                </div>

                <section class="kart" aria-labelledby="sifre-baslik">
                    <div class="kart-baslik"><h2 id="sifre-baslik">Şifre değiştir</h2></div>
                    <form th:action="@{/profil/sifre}" method="post" class="yigin">
                        <input type="text" name="kullanici" th:value="${k.girisKimligi}" autocomplete="username" hidden>
                        <div class="alan">
                            <label class="etiket" for="mevcutSifre">Mevcut şifre</label>
                            <input class="girdi" type="password" id="mevcutSifre" name="mevcutSifre" autocomplete="current-password" required>
                        </div>
                        <div class="alan">
                            <label class="etiket" for="yeniSifre">Yeni şifre</label>
                            <input class="girdi" type="password" id="yeniSifre" name="yeniSifre" autocomplete="new-password" minlength="8" required aria-describedby="yeni-ipucu">
                            <span class="alan-ipucu" id="yeni-ipucu">En az 8 karakter.</span>
                        </div>
                        <div class="alan">
                            <label class="etiket" for="yeniSifreTekrar">Yeni şifre tekrar</label>
                            <input class="girdi" type="password" id="yeniSifreTekrar" name="yeniSifreTekrar" autocomplete="new-password" minlength="8" required>
                        </div>
                        <div><button type="submit" class="dugme dugme-birincil">Şifreyi değiştir</button></div>
                    </form>
                </section>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/sablon :: genelAlt}"></footer>
</div>
<th:block th:replace="~{fragments/sablon :: scriptler}"></th:block>
</body>
</html>
