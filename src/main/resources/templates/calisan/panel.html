<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/sablon :: head('Randevular')}"></head>
<body>
<div class="sayfa">
    <th:block th:replace="~{fragments/sablon :: siteUst('randevular')}"></th:block>

    <main class="ana" id="icerik">
        <div class="ana-ic">
            <div class="sayfa-baslik">
                <div class="yigin-sik">
                    <h1 th:text="${calisan.gorunenAd}">Dr. Ad Soyad</h1>
                    <p th:text="${calisan.unvan} + ' · ' + ${calisan.sube.tamAd} + (${calisan.bolum != null} ? ' · ' + ${calisan.bolum.ad} : '')"></p>
                </div>
            </div>

            <div th:replace="~{fragments/sablon :: mesajlar}"></div>

            <section class="oncu oncu-vurgulu" aria-labelledby="bugun-baslik">
                <div class="yigin">
                    <span class="kart-ust-etiket" id="bugun-baslik" th:text="'Bugün, ' + ${@tarih.gunAy(T(java.time.LocalDate).now())}">Bugün</span>
                    <p class="oncu-deger sayilar" th:text="${bugunku.size()} + ' randevu'">0 randevu</p>
                    <div class="oncu-detaylar" th:if="${siradaki != null}">
                        <div>
                            <svg th:replace="~{fragments/sablon :: ikon('saat')}"></svg>
                            <span>Sıradaki:
                                <strong th:text="${@tarih.tarihEtiketi(siradaki.baslangic.toLocalDate())} + ' ' + ${#temporals.format(siradaki.baslangic, 'HH:mm')}"></strong>
                                <span th:text="' · ' + ${siradaki.hasta.adSoyad} + ', ' + ${siradaki.hizmet.ad}"></span>
                            </span>
                        </div>
                    </div>
                    <p class="metin-ikincil" th:if="${siradaki == null}">Yaklaşan randevunuz bulunmuyor.</p>
                </div>
            </section>

            <section class="kart" aria-labelledby="liste-baslik">
                <h2 id="liste-baslik" class="gorsel-gizli">Randevu listesi</h2>
                <nav class="sekmeler" aria-label="Randevu durumu">
                    <a th:each="s : ${sekmeler}" class="sekme" th:href="@{/calisan(sekme=${s})}"
                       th:attr="aria-current=${s == seciliSekme} ? 'page' : null">
                        <span th:text="${s.etiket}"></span>
                        <span class="sekme-sayisi sayilar" th:text="${sekmeSayilari.get(s)}"></span>
                    </a>
                </nav>
                <th:block th:if="${#lists.isEmpty(randevular)}">
                    <div th:replace="~{fragments/sablon :: bosDurum('gelen', 'Bu listede randevu yok', 'Yeni talepler geldiğinde onay bekleyenler sekmesinde görünür.')}"></div>
                </th:block>
                <ul role="list" class="randevu-listesi" th:unless="${#lists.isEmpty(randevular)}">
                    <th:block th:each="r : ${randevular}"><li th:replace="~{fragments/sablon :: randevuSatiri(${r}, 'calisan')}"></li></th:block>
                </ul>
            </section>
        </div>
    </main>
    <footer th:replace="~{fragments/sablon :: genelAlt}"></footer>
</div>
<dialog th:replace="~{fragments/sablon :: onayDiyalogu}"></dialog>
<th:block th:replace="~{fragments/sablon :: scriptler}"></th:block>
</body>
</html>
