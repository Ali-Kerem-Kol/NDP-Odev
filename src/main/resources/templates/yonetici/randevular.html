<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/sablon :: head('Randevular')}"></head>
<body>
<div class="sayfa">
    <th:block th:replace="~{fragments/sablon :: siteUst('randevular')}"></th:block>

    <main class="ana" id="icerik">
        <div class="ana-ic">
            <div class="sayfa-baslik">
                <div class="yigin-sik">
                    <h1>Randevular</h1>
                    <p th:text="${kurum.ad} + ' bünyesindeki tüm şubelerin randevuları.'"></p>
                </div>
            </div>
            <div th:replace="~{fragments/sablon :: mesajlar}"></div>

            <section class="kart" aria-labelledby="liste-baslik">
                <h2 id="liste-baslik" class="gorsel-gizli">Randevu listesi</h2>
                <nav class="sekmeler" aria-label="Randevu durumu">
                    <a th:each="s : ${sekmeler}" class="sekme" th:href="@{/yonetici/randevular(sekme=${s})}"
                       th:attr="aria-current=${s == seciliSekme} ? 'page' : null">
                        <span th:text="${s.etiket}"></span>
                        <span class="sekme-sayisi sayilar" th:text="${sekmeSayilari.get(s)}"></span>
                    </a>
                </nav>
                <th:block th:if="${#lists.isEmpty(randevular)}">
                    <div th:replace="~{fragments/sablon :: bosDurum('gelen', 'Bu listede randevu yok', 'Başka bir sekmeye geçerek diğer randevuları görebilirsiniz.')}"></div>
                </th:block>
                <ul role="list" class="randevu-listesi" th:unless="${#lists.isEmpty(randevular)}">
                    <th:block th:each="r : ${randevular}"><li th:replace="~{fragments/sablon :: randevuSatiri(${r}, 'yonetici')}"></li></th:block>
                </ul>
            </section>
        </div>
    </main>
    <footer th:replace="~{fragments/sablon :: genelAlt}"></footer>
</div>
<dialog th:replace="~{fragments/sablon :: onayDiyalogu}"></dialog>
<th:block th:replace="~{fragments/sablon :: scriptler}"></th:block>
</body>
</html>
