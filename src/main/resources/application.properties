spring.application.name=hastane-randevu
server.port=${PORT:8080}

# H2 bellek içi veritabanı (uygulama her açılışta örnek verilerle yeniden kurulur)
spring.datasource.url=jdbc:h2:mem:randevudb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Geliştirme sırasında tabloları incelemek için true yapılabilir (yalnızca yerel ortamda)
spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true

# Şablonlar önbelleğe alınır (varsayılan). Geliştirirken değişikliği yeniden başlatmadan görmek için
# geçici olarak false yapılabilir; ama o zaman eski Java sınıflarıyla yeni şablonlar karışabilir.
spring.thymeleaf.cache=true
spring.web.locale=tr_TR
spring.web.locale-resolver=fixed

# Randevu yaşam döngüsü: zamanlayıcı her dakika çalışır.
# Onaylı randevu, bitişinden bu kadar sonra hâlâ "gelmedi" işaretlenmemişse otomatik tamamlanır.
randevu.otomatik-tamamlama-toleransi=PT2H
randevu.zamanlayici-araligi-ms=60000

# Türkçe log mesajları konsolda bozulmasın
logging.charset.console=UTF-8

# Kötüye kullanım koruması: aynı hesaba 15 dakikada 5, aynı cihazdan 20 hatalı giriş -> 15 dakika kilit.
# Kayıt: aynı cihazdan saatte en fazla 10 deneme.
guvenlik.giris.hesap-azami-deneme=5
guvenlik.giris.cihaz-azami-deneme=20
guvenlik.giris.pencere=PT15M
guvenlik.giris.kilit-suresi=PT15M
guvenlik.kayit.cihaz-azami-deneme=10
guvenlik.kayit.pencere=PT1H
